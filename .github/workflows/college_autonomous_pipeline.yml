name: College Engineering Portal 2x Daily Pipeline

on:
  schedule:
    # Runs twice daily:
    # 08:00 AM IST -> 02:30 UTC
    # 05:00 PM IST -> 11:30 UTC
    - cron: '30 2,11 * * *'
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions UI

jobs:
  run-college-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run College 16-Branch Ingestion
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          NEWSFLOW_WEB_URL: ${{ secrets.COLLEGE_PORTAL_WEB_URL || 'https://your-college-portal.vercel.app' }}
          NEWSFLOW_API_KEY: ${{ secrets.COLLEGE_PORTAL_API_KEY }}
          NEWSFLOW_WEB_API_KEY: ${{ secrets.COLLEGE_PORTAL_API_KEY }}
          DATABASE_URL: ${{ secrets.COLLEGE_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_REMOTE_CONTROL: 'false'
          TELEGRAM_NOTIFY_COMPLETION: 'true'
          AUTO_PUBLISH_TO_WEB: 'true'
          DEFAULT_WEB_STATUS: 'published'
          PIPELINE_MAX_WORKERS: '16'
        run: |
          python run.py --config config/sources_college.yaml --max-articles 2
