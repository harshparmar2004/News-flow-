name: NewsFlow 24/7 Autonomous Pipeline

on:
  schedule:
    # Runs every 2 hours continuously (24/7)
    - cron: '0 */2 * * *'
  workflow_dispatch:
    # Allows manual 1-click trigger from GitHub Actions UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run NewsFlow Autonomous Pipeline
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          NEWSFLOW_WEB_URL: ${{ secrets.NEWSFLOW_WEB_URL || 'https://news-flow-one.vercel.app' }}
          NEWSFLOW_API_KEY: ${{ secrets.NEWSFLOW_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_REMOTE_CONTROL: 'false'
          TELEGRAM_NOTIFY_COMPLETION: 'true'
        run: |
          python run.py --max-articles 5
