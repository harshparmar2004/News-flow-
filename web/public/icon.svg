<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Terracotta Medallion Gradient -->
    <linearGradient id="nfBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E45B2B" />
      <stop offset="42%" stop-color="#C96442" />
      <stop offset="100%" stop-color="#9C3412" />
    </linearGradient>

    <!-- Inner Glass Bevel Highlight -->
    <linearGradient id="nfBevelRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.36" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22" />
    </linearGradient>

    <!-- Left Pillar (Clean Crisp Editorial Paper) -->
    <linearGradient id="nfLeftPillar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F5EFE6" />
    </linearGradient>

    <!-- Right Pillar (Clean Crisp Editorial Paper) -->
    <linearGradient id="nfRightPillar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FAF5EE" />
    </linearGradient>

    <!-- Dynamic Fold Diagonal (Bright Warm Cream with subtle directional shadow) -->
    <linearGradient id="nfDiagonalFold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FDFBF7" />
      <stop offset="75%" stop-color="#F4EFE6" />
      <stop offset="100%" stop-color="#E2D4BF" />
    </linearGradient>

    <!-- Warm Amber Ambient Glow at fold crease -->
    <linearGradient id="nfCreaseGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9660" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#9C3412" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow for Fold Ribbon Depth -->
    <filter id="nfFoldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-5" dy="7" stdDeviation="9" flood-color="#4F1706" flood-opacity="0.48" />
    </filter>

    <!-- Global Badge Drop Shadow -->
    <filter id="nfBadgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#481506" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Terracotta Squircle Outer Badge -->
  <rect x="24" y="24" width="464" height="464" rx="124" fill="url(#nfBgGrad)" filter="url(#nfBadgeShadow)" />
  <rect x="25" y="25" width="462" height="462" rx="123" fill="none" stroke="url(#nfBevelRim)" stroke-width="3" />

  <!-- The Master Origami Ribbon 'N' -->
  <g id="origami-n">
    <!-- Right Pillar (Clean vertical facet, gently rounded corners) -->
    <rect x="312" y="112" width="80" height="288" rx="16" fill="url(#nfRightPillar)" />

    <!-- Left Pillar (Clean vertical facet, gently rounded corners) -->
    <rect x="120" y="112" width="80" height="288" rx="16" fill="url(#nfLeftPillar)" />

    <!-- Fold Crease Ambient Warmth -->
    <path d="M120 112 L200 112 L392 400 L312 400 Z" fill="url(#nfCreaseGlow)" />

    <!-- Diagonal Ribbon Fold (Layered directly over pillars with shadow) -->
    <path d="M120 112 L200 112 L392 400 L312 400 Z" fill="url(#nfDiagonalFold)" filter="url(#nfFoldShadow)" />

    <!-- Top Left Fold Bevel Highlight (Paper Turn Crease) -->
    <polygon points="120,112 200,112 160,166 120,112" fill="#FFFFFF" opacity="0.6" />

    <!-- Bottom Right Fold Shadow Triangle -->
    <polygon points="312,400 392,400 352,346 312,400" fill="#69240E" opacity="0.4" />
  </g>
</svg>