<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Beige Gradient -->
    <linearGradient id="beigeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="100%" stop-color="#F4EFE6" />
    </linearGradient>

    <!-- Subtle Border Stroke -->
    <linearGradient id="beigeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBE4D5" />
      <stop offset="100%" stop-color="#D9CFBC" />
    </linearGradient>

    <!-- Terracotta Orange Wave Ribbon (Left / Main Stem) -->
    <linearGradient id="orangeRibbon1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B84A28" />
      <stop offset="35%" stop-color="#C96442" />
      <stop offset="70%" stop-color="#E25828" />
      <stop offset="100%" stop-color="#FF6E38" />
    </linearGradient>

    <!-- Vibrant Coral-Orange Ribbon (Right / Flow Stem) -->
    <linearGradient id="orangeRibbon2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D24F22" />
      <stop offset="40%" stop-color="#EA5E2E" />
      <stop offset="100%" stop-color="#FF824D" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8C5C43" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Warm Beige Squircle Badge -->
  <rect x="20" y="20" width="472" height="472" rx="124" ry="124" fill="url(#beigeBg)" stroke="url(#beigeBorder)" stroke-width="8" filter="url(#badgeShadow)" />

  <!-- The Iconic 'N' Wave Monogram in Signature Terracotta Orange -->
  <g id="monogram-n">
    <!-- Left Pillar Arch (Folded Ribbon) -->
    <path d="M148 354 C146 264, 172 198, 228 168 C244 158, 266 170, 258 188 C240 230, 218 274, 188 344 C180 362, 156 368, 148 354 Z" fill="url(#orangeRibbon1)" />

    <!-- Central Fluid Flow Wave (The Diagonal Stream) -->
    <path d="M174 256 C216 188, 282 164, 348 244 C360 258, 350 278, 332 278 C272 278, 218 318, 192 360 C182 376, 160 370, 158 352 C154 314, 160 276, 174 256 Z" fill="url(#orangeRibbon1)" />

    <!-- Upper Loop and Right Arch (Secondary Ribbon Wave) -->
    <path d="M222 196 C272 150, 328 164, 356 218 C364 232, 378 224, 376 208 C370 166, 340 138, 286 148 C246 156, 212 178, 184 208 C172 220, 184 236, 198 228 C206 222, 216 208, 222 196 Z" fill="url(#orangeRibbon2)" />

    <!-- Right Pillar Ascent -->
    <path d="M296 344 C326 300, 352 254, 372 190 C376 176, 394 178, 394 194 C394 242, 372 292, 338 338 C320 362, 288 358, 296 344 Z" fill="url(#orangeRibbon2)" />

    <!-- Sleek Center Paper Accent Curve -->
    <path d="M198 222 C234 186, 274 212, 308 246 C314 252, 324 248, 322 240 C306 206, 268 180, 230 196 C216 202, 204 214, 198 222 Z" fill="#FFFFFF" opacity="0.65" />
  </g>
</svg>
